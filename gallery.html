<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Gallery | Cliff's Custom Creations</title>

  <meta
    name="description"
    content="Browse custom tumblers, wallets, coasters, keychains, woodwork, and personalized gifts from Cliff's Custom Creations."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body data-gallery="all">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        Cliff's Custom Creations
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Open navigation"
      >
        ☰
      </button>

      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="custom-order.html">Custom Order</a>
        <a href="reviews.html">Reviews</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Handcrafted with purpose</p>

        <h1>Our Work</h1>

        <p class="page-intro">
          Browse custom tumblers, wallets, coasters, keychains,
          woodwork, and personalized keepsakes.
        </p>
      </div>
    </section>

    <section class="gallery-section">
      <div class="container">
        <div class="gallery-toolbar">
          <div
            id="gallery-filters"
            class="gallery-filters"
            aria-label="Gallery categories"
          ></div>

          <p id="page-count" class="page-count"></p>
        </div>

        <div
          id="gallery-grid"
          class="gallery-grid"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>
        © Cliff's Custom Creations
      </p>

      <p>
        “The Lord bless you and keep you.” — Numbers 6:24
      </p>
    </div>
  </footer>

  <script src="site.js"></script>
</body>
</html>
